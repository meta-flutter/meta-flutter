# We have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes*/*/*.bb \
    ${LAYERDIR}/recipes*/*/*.bbappend \
    ${LAYERDIR}/recipes*/*/*/*.bb \
    ${LAYERDIR}/recipes*/*/*/*.bbappend \
    ${LAYERDIR}/images/*.bb \
"

BBFILE_COLLECTIONS += "flutter-layer"
BBFILE_PATTERN_flutter-layer := "^${LAYERDIR}/"
BBFILE_PRIORITY_flutter-layer = "12"

LAYERDEPENDS_flutter-layer = "core openembedded-layer"
LAYERRECOMMENDS_flutter-layer = " clang-layer"
LAYERSERIES_COMPAT_flutter-layer = "gatesgarth hardknott honister kirkstone"

# pub-cache.bbclass bounds its offline resolve with timeout(1). This branch's
# oe-core does not list it in HOSTTOOLS, so the task fails with 127 without it.
HOSTTOOLS_NONFATAL += "timeout"

BBFILES_DYNAMIC += " \
    clang-layer:${LAYERDIR}/dynamic-layers/clang-layer/*/*/*.bb \
    clang-layer:${LAYERDIR}/dynamic-layers/clang-layer/*/*/*/*.bb \
    clang-layer:${LAYERDIR}/dynamic-layers/clang-layer/*/*/*.bbappend \
"
