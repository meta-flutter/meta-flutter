name: kirkstone-build

# Builds per pull request, and covers every machine master covers. The runner
# is sequential, so the matrix queues and runs one machine at a time against a
# single tree, which is how master's tmp comes to hold all four already.
#
# This was dispatch-only on the grounds that a populated tmp is around 106G
# against 264G free. That figure was an assumption and it was wrong: measured,
# the five trees come to 153G in total, 19G to 34G each, against terabytes
# free -- see the reclaim step below, which has been conditional on the disk
# actually being short since. master, wrynose and scarthgap already build per
# pull request; this branch is next in line for parity work and should not
# take it unbuilt.
#
# The tree here is this branch's own, so master's is never disturbed.

on:
  pull_request:
    # No 'closed': nothing here is conditioned on the event, so closing or
    # merging would start a second full build of work already merged.
    types: [ opened, synchronize, reopened ]
    # A change that cannot affect a build should not cost a matrix.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'tools/**'
      - '.github/workflows/tools-tests.yml'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

# One run per branch. Every push to a pull request starts a run and GitHub does
# not stop the previous one, so an iterated branch leaves a queue of runs
# against commits that have already been superseded.
#
# Cancelling is limited to pull_request on purpose: a workflow_dispatch is
# someone deliberately asking for a build, and a second dispatch on the same
# ref should not silently kill the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  kirkstone-build:

    strategy:
      # Every machine master covers. The runner is sequential, so these queue
      # and run one at a time against the same tree, exactly as master's four
      # per-machine workflows do.
      fail-fast: false
      matrix:
        machine: [qemux86-64, qemuarm64, qemuriscv64, qemuarm]

    name: kirkstone-${{ matrix.machine }}

    env:
      MACHINE: ${{ matrix.machine }}
      # openembedded-core, meta-yocto and meta-openembedded carry kirkstone.
      YOCTO_BRANCH: kirkstone
      # bitbake is versioned rather than named after the release. kirkstone's
      # openembedded-core declares BB_MIN_VERSION 1.53.0, which is a floor;
      # 2.0 is the branch that shipped with kirkstone.
      BITBAKE_BRANCH: '2.0'
      # meta-drm and meta-vulkan both carry kirkstone, unlike wrynose where
      # they only have master.
      # this release's openembedded-core predates clang moving into oe-core, so
      # the clang toolchain has to come from meta-clang here. Master needs none.
      CLANG_BRANCH: kirkstone-clang18
      DRM_BRANCH: kirkstone
      VULKAN_BRANCH: kirkstone

    runs-on: [self-hosted, linux]

    container:
      image: ghcr.io/meta-flutter/meta-flutter/ubuntu-24-dev:main
      options:
        --read-only
        --log-driver=none
        --user 1001:1001
        --userns keep-id:uid=1001,gid=1001
        --security-opt label=disable
        --pids-limit=-1
        --storage-opt overlay.mount_program=/usr/bin/fuse-overlayfs
        --storage-opt overlay.mountopt=nodev,metacopy=on,noxattrs=1
        -v /home/runner/.ssh:/home/dev/.ssh:ro
        -v /mnt/raid10/github-ci/download:/home/dev/dl:Z
        -v /mnt/raid10/github-ci/sstate/yocto/kirkstone-linux-dummy:/home/dev/sstate:Z

    steps:

      - uses: actions/checkout@v5
        with:
          path: ''

      - name: Free other release-branch trees
        run: |
          # Reclaim other release branches' build/tmp, but only when the disk
          # is actually short.
          #
          # This used to run unconditionally, on the assumption that a tree
          # measures around 106G and so only two would fit. Measured, the five
          # trees come to 153G in total -- 19G to 34G each -- against terabytes
          # free. Every job was destroying 30-50G that the next build of that
          # branch then re-extracted from sstate, for space that was never
          # scarce. master's tree is left alone regardless, so its
          # per-pull-request builds stay fast.
          MIN_FREE_GB=${CI_MIN_FREE_GB:-300}
          free_gb=$(df -BG --output=avail . | tail -1 | tr -dc '0-9')
          if [ "${free_gb:-0}" -ge "$MIN_FREE_GB" ]; then
            echo "${free_gb}G free (>= ${MIN_FREE_GB}G), keeping the other release trees"
          else
            echo "${free_gb}G free (< ${MIN_FREE_GB}G), reclaiming other release trees"
            for d in ../*-linux-dummy; do
              case "$(basename "$d")" in
                master-linux-dummy|kirkstone-linux-dummy) continue ;;
              esac
              [ -d "$d/build/tmp" ] || continue
              echo "removing $(du -sh "$d/build/tmp" | cut -f1) from $d/build/tmp"
              rm -rf "$d/build/tmp"
            done
          fi

      - name: Fetch poky
        run: |
          [ -d ../kirkstone-linux-dummy ] || mkdir -p ../kirkstone-linux-dummy
          cd ../kirkstone-linux-dummy
          pwd
          # every layer cloned below must be listed here: this is a persistent
          # self-hosted runner and 'git clone' into an existing directory fails.
          rm -rf poky bitbake openembedded-core meta-yocto \
                 meta-openembedded meta-clang meta-drm meta-vulkan
          # 'wait' with no operands always returns 0, so collect the pids and
          # wait on each to see a failed clone.
          pids=""
          for spec in \
              "${{ env.BITBAKE_BRANCH }}|https://github.com/openembedded/bitbake.git" \
              "${{ env.YOCTO_BRANCH }}|https://github.com/openembedded/openembedded-core.git" \
              "${{ env.YOCTO_BRANCH }}|https://github.com/yoctoproject/meta-yocto.git" \
              "${{ env.YOCTO_BRANCH }}|https://github.com/openembedded/meta-openembedded.git" \
              "${{ env.CLANG_BRANCH }}|https://github.com/kraj/meta-clang.git" \
              "${{ env.DRM_BRANCH }}|https://github.com/jwinarske/meta-drm.git" \
              "${{ env.VULKAN_BRANCH }}|https://github.com/jwinarske/meta-vulkan.git" ; do
              branch=${spec%%|*}
              repo=${spec#*|}
              git clone -b "$branch" --single-branch "$repo" &
              pids="$pids $!:$repo@$branch"
          done

          rc=0
          for entry in $pids; do
              pid=${entry%%:*}
              repo=${entry#*:}
              if ! wait "$pid"; then
                  echo "::error::clone failed: $repo"
                  rc=1
              fi
          done
          exit $rc

      - name: Recover from an interrupted run
        shell: bash
        working-directory: ../kirkstone-linux-dummy
        run: |
          MARKER=.ci-build-incomplete
          if [ -e "$MARKER" ]; then
            echo "::warning::previous run did not finish; removing build/tmp"
            if [ -d build/tmp ]; then
              echo "removing $(du -sh build/tmp | cut -f1) from build/tmp"
              rm -rf build/tmp
            fi
            rm -f "$MARKER"
          else
            echo "previous run finished cleanly; keeping build/tmp"
          fi
          : > "$MARKER"

      - name: Configure build
        shell: bash
        working-directory: ../kirkstone-linux-dummy
        run: |
          rm -rf build/conf
          . ./openembedded-core/oe-init-build-env
          echo '***************************************'
          sed -i '/MACHINE ??=/d' ./conf/local.conf
          echo "MACHINE ??= \"${{ env.MACHINE }}\"" >> ./conf/local.conf
          echo '***************************************'
          # Include CI build configuration to disable SPDX
          echo 'require ../../meta-flutter/conf/distro/include/ci-build.inc' >> ./conf/local.conf
          echo '********** ./conf/local.conf **********'
          cat ./conf/local.conf
          echo '***************************************'
          bitbake-layers show-layers
          bitbake-layers add-layer \
              ../openembedded-core/meta \
              ../meta-yocto/meta-yocto-bsp \
              ../meta-yocto/meta-poky \
              ../meta-openembedded/meta-oe \
              ../meta-openembedded/meta-filesystems \
              ../meta-openembedded/meta-gnome \
              ../meta-openembedded/meta-multimedia \
              ../meta-openembedded/meta-networking \
              ../meta-openembedded/meta-python \
              ../meta-clang \
              ../meta-drm \
              ../meta-vulkan \
              ../../meta-flutter \
              ../../meta-flutter/meta-flutter-apps
          bitbake-layers show-layers
          echo '***************************************'
          bitbake -e virtual/kernel | grep "^PV"
          bitbake -e virtual/kernel | grep "^PN"
          echo '***************************************'
          bitbake -e core-image-minimal | grep "^DISTRO_FEATURES"
          echo '***************************************'
          bitbake -e > bb.environment

      - name: Build ca-certificates
        shell: bash
        working-directory: ../kirkstone-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake ca-certificates

      - name: Build ca-certificates-native
        shell: bash
        working-directory: ../kirkstone-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake ca-certificates-native

      - name: Build flutter-sdk-native
        shell: bash
        working-directory: ../kirkstone-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake flutter-sdk-native

      - name: Build dart-sdk
        shell: bash
        working-directory: ../kirkstone-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake dart-sdk

      - name: Build sentry
        shell: bash
        working-directory: ../kirkstone-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake sentry

      - name: Build rive-text
        shell: bash
        working-directory: ../kirkstone-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake rive-text

      - name: Build flutter-engine
        shell: bash
        working-directory: ../kirkstone-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake flutter-engine

      - name: Build ivi-homescreen
        shell: bash
        working-directory: ../kirkstone-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake ivi-homescreen

      - name: Build flutter-auto
        shell: bash
        working-directory: ../kirkstone-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake flutter-auto

      - name: Build flutter-pi
        id: base
        shell: bash
        working-directory: ../kirkstone-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake flutter-pi

      # The flutter-elinux embedders. These link libflutter_engine.so directly, so they
      # are the recipes that exercise FLUTTER_ENGINE_PACKAGE -- nothing else in
      # this workflow does, and #887 sat broken because none of them was ever
      # built here.
      #
      # x11-client needs the x11 distro feature and the rest need wayland; the
      # CI distro carries both.
      - name: Build the flutter-elinux embedders
        shell: bash
        working-directory: ../kirkstone-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake flutter-wayland-client \
                  flutter-x11-client \
                  flutter-drm-gbm-backend \
                  flutter-drm-eglstream-backend
      # The ivi-homescreen v3 integration tests. All ten come from one upstream
      # tree at HOMESCREEN_COMMIT through ivi-homescreen-test.inc, so they share
      # a source revision and stand or fall together far more often than not.
      # One workflow step rather than ten, but bitbake is called once per recipe
      # so they build one at a time.
      #
      # They were briefly built in a single `bitbake app1 app2 ...` call, which
      # let bitbake run all ten do_compile tasks at once. That is faster and it
      # breaks: every one of them drives the flutter tool against its own
      # recipe-sysroot-native, whose SDK files are hardlinked from the shared
      # native sysroot, so concurrent writes under bin/cache are visible to the
      # others. A recipe that reads that directory mid-write decides the tool
      # snapshot is stale and re-resolves packages/flutter_tools -- and that
      # internal bootstrap does not inherit our --offline, so in a
      # network-isolated do_compile it can only fail:
      #
      #   Failed host lookup: 'pub.dev' ... /api/packages/archive/advisories
      #   flutter pub get --enforce-lockfile --offline -v failed: 69
      #
      # It hit one recipe of ten on qemuarm64 and none on qemux86-64 in the same
      # run, which is what a race looks like. Serializing costs a couple of
      # minutes and removes the window.
      - name: Build ivi-homescreen integration tests
        # flutter build bundle has no linux-arm target platform,
        # so the app recipes do not parse for a 32-bit machine
        if: ${{ !cancelled() && steps.base.outcome == 'success' && matrix.machine != 'qemuarm' }}
        shell: bash
        working-directory: ../kirkstone-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          apps="ivi-homescreen-gesture-playground \
            ivi-homescreen-hardware-keyboard-test \
            ivi-homescreen-keyboard-test \
            ivi-homescreen-mcp-drive-test \
            ivi-homescreen-multi-touch-test \
            ivi-homescreen-multi-view-test \
            ivi-homescreen-osgi-activator-test \
            ivi-homescreen-scroll-bench \
            ivi-homescreen-stopwatch-stress-test \
            ivi-homescreen-watchdog-test"
          # Report every failing test, not just the first. A round costs
          # over an hour, so learning about one broken recipe at a time
          # turns a single bad commit into a week of rebuilds.
          failed=""
          for a in $apps; do
            if bitbake $a; then
              continue
            fi
            failed="$failed $a"
          done
          if [ -n "$failed" ]; then
            echo "::error::integration tests failed:$failed"
            exit 1
          fi

      # The FFI applications. Both inherit flutter-app-native, so their Dart
      # packages carry hook/build.dart and compile native code during
      # `flutter build bundle` -- the path the integration tests above never
      # reach. They need the flutter_tools patch and the FLUTTER_HOOK_* wrappers
      # to build for the target rather than the build host; without those the
      # hook resolves a host compiler and emits a host-architecture library into
      # a target package (meta-flutter#801).
      #
      # master and the scarthgap-and-later branches build two further apps here,
      # flutter-remote-manager and flathub-catalog. Both are omitted on this
      # release rather than left failing: flatpak entered meta-openembedded in
      # scarthgap and appstream entered oe-core in scarthgap, so neither has
      # anything here to resolve against. A hook that cannot find its library in
      # the sysroot silently falls back to the build host's copy, which is how
      # flathub-catalog came to ship a libappstream.so wanting GLIBCXX_3.4.31 --
      # a symbol version this release's GCC 11 target does not provide.
      #
      # packagekit_dart: talks to PackageKit over D-Bus, exercising the same
      # hook path against a system library that does exist here.
      - name: Build jwinarske-packagekit-dart-packagekit-catalog
        # No linux-arm target platform for flutter build bundle, and the
        # package's hook handles only x64 and arm64, so riscv64 is out too --
        # see COMPATIBLE_HOST on the recipe.
        if: ${{ !cancelled() && steps.base.outcome == 'success' && matrix.machine != 'qemuarm' && matrix.machine != 'qemuriscv64' }}
        shell: bash
        working-directory: ../kirkstone-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake jwinarske-packagekit-dart-packagekit-catalog

      #
      # bluez_native: compiles a vendored sdbus-c++ from its own hook.
      - name: Build jwinarske-bluez-native-flutter-ble-scanner
        # flutter build bundle has no linux-arm target platform,
        # so the app recipes do not parse for a 32-bit machine
        if: ${{ !cancelled() && steps.base.outcome == 'success' && matrix.machine != 'qemuarm' }}
        shell: bash
        working-directory: ../kirkstone-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake jwinarske-bluez-native-flutter-ble-scanner

      # Only reached when every step above succeeded; a failed or cancelled run
      # leaves the marker behind for the next one to act on.
      - name: Build the Flutter SDK example apps
        # flutter build bundle has no linux-arm target platform,
        # so the app recipes do not parse for a 32-bit machine
        if: ${{ !cancelled() && steps.base.outcome == 'success' && matrix.machine != 'qemuarm' }}
        shell: bash
        working-directory: ../kirkstone-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          # hello_world proves the shape; flutter_gallery proves it holds for an
          # app with real dependencies. These are also the only recipes that
          # inherit pub-cache, so without them the class and the timeout
          # hosttool it needs are never executed.
          APPS="flutter-sdk-examples-hello-world \
                flutter-sdk-dev-integration-tests-flutter-gallery"

          # Fetch first, then build with the network off: anything the workspace
          # pub cache fragment failed to declare cannot be fetched and fails here
          # rather than working quietly on a machine that happens to be online.
          bitbake --runall=fetch $APPS
          BB_NO_NETWORK=1 bitbake $APPS

      - name: Mark the build complete
        shell: bash
        working-directory: ../kirkstone-linux-dummy
        run: rm -f .ci-build-incomplete

      # bitbake prints only the path to a failed task's log, and that path is
      # inside the work tree on the runner. Without this a do_configure or
      # do_compile failure reaches us as "ExecutionError(...run.do_configure)"
      # and nothing else, which is not enough to act on. Last in the job so it
      # sees a failure from any step above it.
      - name: Show bitbake failure logs
        if: failure()
        shell: bash
        working-directory: ../kirkstone-linux-dummy
        run: |
          found=0
          while IFS= read -r f; do
            grep -qiE '^(ERROR|CMake Error)|error:' "$f" || continue
            found=1
            echo "::group::$f"
            tail -120 "$f"
            echo "::endgroup::"
          done < <(find build/tmp*/work -name 'log.do_*' -mmin -240 2>/dev/null | head -40)
          [ "$found" = 1 ] || echo "no task log with an error recorded in the last 4h"
