name: tools-tests

# The Python under tools/ has no coverage in the build workflows: 'tools/**'
# is in their paths-ignore, correctly, because a script change should not
# trigger four hour-long Yocto builds. This runs the test suites instead.
#
# GitHub-hosted on purpose. The build workflows use the self-hosted runner and
# run one at a time; a five-second test run must not queue behind an hour-long
# build, and it needs nothing the self-hosted runner provides.

on:
  pull_request:
    paths:
      - 'tools/**'
      - '.github/workflows/tools-tests.yml'
  workflow_dispatch:

jobs:

  pytest:
    name: pytest (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor: pubvendor.py annotates dataclass fields with
        # 'str | None', which is evaluated at class creation. Newest is
        # tested too so a deprecation surfaces here rather than on a
        # maintainer's machine.
        python: ['3.10', '3.13']
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 📦 Install Dependencies
        # From the file, not a second hand-kept list. The two drifted before:
        # the README named pycurl and pyyaml, CI installed pytest and pyyaml,
        # and certifi -- which the roll actually needs -- was in neither.
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check -r tools/requirements.txt

      - name: 🧪 Run tools test suites
        # Discovers every tests/ dir under tools/, so a new tool with tests
        # is picked up without touching this workflow.
        run: python -m pytest tools -q

  offline-get:
    # #845: the staged pub cache layout is a pub internal, not a documented
    # contract. The unit tests can only assert what pubvendor emits; only a
    # real `pub get --offline` shows the layout is one pub accepts, and only
    # for the SDK it ran with -- hence the matrix.
    name: offline pub get (dart ${{ matrix.dart }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # An older SDK and the current stable, so a layout change surfaces
        # when Dart rolls rather than when someone's build breaks.
        dart: ['3.6', 'stable']
    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.dart }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 📦 Install Dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: 🌐 Stage a cache and resolve from it offline
        # Network populates the cache; the pub get itself is --offline and
        # fails if it reaches out.
        run: python tools/pubvendor/offline_check.py
