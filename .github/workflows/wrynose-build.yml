name: wrynose-build

# wrynose builds per pull request, like master, and covers every machine master
# covers. The runner is sequential, so the matrix queues and runs one machine at
# a time against a single tree, which is how master's tmp comes to hold all four
# already.
#
# This branch gets per-pull-request builds because it is the release branch
# under active use, and because two populated trees fit: one measures around
# 106G. The older release branches stay dispatch-only, since a third and fourth
# tree would not. The tree here is this branch's own, so master's is never
# disturbed, and any other release branch's tmp is removed first, which holds
# the remaining release branches to one populated tree between them -- a
# dispatch of one of those will evict this branch's tree, which then rebuilds
# from sstate on the next pull request.

on:
  pull_request:
    # No 'closed': nothing here is conditioned on the event, so closing or
    # merging a pull request started a second full build of work already
    # merged. One of those sat queued for an hour holding both runners while
    # a kirkstone build waited behind it, and kirkstone started within a
    # minute of it being cancelled.
    types: [ opened, synchronize, reopened ]
    # Same exclusions master uses: a change that cannot affect a build should
    # not cost four of them.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'tools/**'
      - '.github/workflows/tools-tests.yml'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

# One run per branch. Every push to a pull request starts a run and GitHub
# does not stop the previous one, so an iterated branch leaves a queue of runs
# against commits that have already been superseded -- on a sequential runner,
# each one is roughly an hour of matrix that can only reproduce a result we
# have moved past.
#
# Cancelling is limited to pull_request on purpose. A workflow_dispatch is
# someone deliberately asking for a build, and a second dispatch on the same
# ref should not silently kill the first; the release branches are dispatch
# only, so there it would be the sole behaviour.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  wrynose-build:

    strategy:
      # Every machine master covers. The runner is sequential, so these queue
      # and run one at a time against the same tree, exactly as master's four
      # per-machine workflows do.
      fail-fast: false
      matrix:
        machine: [qemux86-64, qemuarm64, qemuriscv64, qemuarm]

    name: wrynose-${{ matrix.machine }}

    env:
      MACHINE: ${{ matrix.machine }}
      # openembedded-core, meta-yocto and meta-openembedded carry wrynose.
      YOCTO_BRANCH: wrynose
      # bitbake is versioned, not named after the release: wrynose's
      # openembedded-core declares BB_MIN_VERSION 2.18.0.
      BITBAKE_BRANCH: '2.18'
      # meta-drm and meta-vulkan have no wrynose branch; master is the only
      # thing to track there.
      DRM_BRANCH: master
      VULKAN_BRANCH: master

    runs-on: [self-hosted, linux]

    container:
      image: ghcr.io/meta-flutter/meta-flutter/ubuntu-24-dev:main
      options:
        --read-only
        --log-driver=none
        --user 1001:1001
        --userns keep-id:uid=1001,gid=1001
        --security-opt label=disable
        --pids-limit=-1
        --storage-opt overlay.mount_program=/usr/bin/fuse-overlayfs
        --storage-opt overlay.mountopt=nodev,metacopy=on,noxattrs=1
        -v /home/runner/.ssh:/home/dev/.ssh:ro
        -v /mnt/raid10/github-ci/download:/home/dev/dl:Z
        -v /mnt/raid10/github-ci/sstate/yocto/wrynose-linux-dummy:/home/dev/sstate:Z

    steps:

      - uses: actions/checkout@v4
        with:
          path: ''

      - name: Free other release-branch trees
        run: |
          # Reclaim other release branches' build/tmp, but only when the disk
          # is actually short.
          #
          # This used to run unconditionally, on the assumption that a tree
          # measures around 106G and so only two would fit. Measured, the five
          # trees come to 153G in total -- 19G to 34G each -- against terabytes
          # free. Every job was destroying 30-50G that the next build of that
          # branch then re-extracted from sstate, for space that was never
          # scarce. master's tree is left alone regardless, so its
          # per-pull-request builds stay fast.
          MIN_FREE_GB=${CI_MIN_FREE_GB:-300}
          free_gb=$(df -BG --output=avail . | tail -1 | tr -dc '0-9')
          if [ "${free_gb:-0}" -ge "$MIN_FREE_GB" ]; then
            echo "${free_gb}G free (>= ${MIN_FREE_GB}G), keeping the other release trees"
          else
            echo "${free_gb}G free (< ${MIN_FREE_GB}G), reclaiming other release trees"
            for d in ../*-linux-dummy; do
              case "$(basename "$d")" in
                master-linux-dummy|wrynose-linux-dummy) continue ;;
              esac
              [ -d "$d/build/tmp" ] || continue
              echo "removing $(du -sh "$d/build/tmp" | cut -f1) from $d/build/tmp"
              rm -rf "$d/build/tmp"
            done
          fi

      - name: Fetch poky
        run: |
          [ -d ../wrynose-linux-dummy ] || mkdir -p ../wrynose-linux-dummy
          cd ../wrynose-linux-dummy
          pwd
          # every layer cloned below must be listed here: this is a persistent
          # self-hosted runner and 'git clone' into an existing directory fails.
          rm -rf poky bitbake openembedded-core meta-yocto \
                 meta-openembedded meta-drm meta-vulkan
          # 'wait' with no operands always returns 0, so collect the pids and
          # wait on each to see a failed clone.
          pids=""
          for spec in \
              "${{ env.BITBAKE_BRANCH }}|https://github.com/openembedded/bitbake.git" \
              "${{ env.YOCTO_BRANCH }}|https://github.com/openembedded/openembedded-core.git" \
              "${{ env.YOCTO_BRANCH }}|https://github.com/yoctoproject/meta-yocto.git" \
              "${{ env.YOCTO_BRANCH }}|https://github.com/openembedded/meta-openembedded.git" \
              "${{ env.DRM_BRANCH }}|https://github.com/jwinarske/meta-drm.git" \
              "${{ env.VULKAN_BRANCH }}|https://github.com/jwinarske/meta-vulkan.git" ; do
              branch=${spec%%|*}
              repo=${spec#*|}
              git clone -b "$branch" --single-branch "$repo" &
              pids="$pids $!:$repo@$branch"
          done

          rc=0
          for entry in $pids; do
              pid=${entry%%:*}
              repo=${entry#*:}
              if ! wait "$pid"; then
                  echo "::error::clone failed: $repo"
                  rc=1
              fi
          done
          exit $rc

      # Recover from a run that did not finish.
      #
      # Every recipe used to be cleansstate'd before building, which rebuilt the
      # whole layer from source on every job to guard against state left by an
      # interrupted build. That is an hour a round spent on something that only
      # happens after an abnormal exit, and it guarded narrowly: a per-recipe
      # clean cannot fix the cross-recipe drift that actually bites here --
      # orphaned entries in build/tmp/sysroots-components, or a partially
      # written sstate manifest -- which is why runner-maintenance.yml wipes
      # build/tmp instead.
      #
      # So clean when it is warranted and not otherwise. The marker is written
      # before the first build and removed only after the last one succeeds, so
      # it survives exactly the cases that leave bad state: a cancelled run, an
      # OOM kill, a crashed worker. Finding it means the previous run died
      # mid-build, and build/tmp goes -- strictly more than the old per-recipe
      # clean did, and regenerable from the shared sstate mount.
      - name: Recover from an interrupted run
        shell: bash
        working-directory: ../wrynose-linux-dummy
        run: |
          MARKER=.ci-build-incomplete
          if [ -e "$MARKER" ]; then
            echo "::warning::previous run did not finish; removing build/tmp"
            if [ -d build/tmp ]; then
              echo "removing $(du -sh build/tmp | cut -f1) from build/tmp"
              rm -rf build/tmp
            fi
            rm -f "$MARKER"
          else
            echo "previous run finished cleanly; keeping build/tmp"
          fi
          : > "$MARKER"

      - name: Configure build
        shell: bash
        working-directory: ../wrynose-linux-dummy
        run: |
          rm -rf build/conf
          . ./openembedded-core/oe-init-build-env
          echo '***************************************'
          sed -i '/MACHINE ??=/d' ./conf/local.conf
          echo "MACHINE ??= \"${{ env.MACHINE }}\"" >> ./conf/local.conf
          echo '***************************************'
          # Include CI build configuration to disable SPDX
          echo 'require ../../meta-flutter/conf/distro/include/ci-build.inc' >> ./conf/local.conf
          echo '********** ./conf/local.conf **********'
          cat ./conf/local.conf
          echo '***************************************'
          bitbake-layers show-layers
          bitbake-layers add-layer \
              ../openembedded-core/meta \
              ../meta-yocto/meta-yocto-bsp \
              ../meta-yocto/meta-poky \
              ../meta-openembedded/meta-oe \
              ../meta-openembedded/meta-filesystems \
              ../meta-openembedded/meta-gnome \
              ../meta-openembedded/meta-multimedia \
              ../meta-openembedded/meta-networking \
              ../meta-openembedded/meta-python \
              ../meta-drm \
              ../meta-vulkan \
              ../../meta-flutter \
              ../../meta-flutter/meta-flutter-apps
          bitbake-layers show-layers
          echo '***************************************'
          bitbake -e virtual/kernel | grep "^PV"
          bitbake -e virtual/kernel | grep "^PN"
          echo '***************************************'
          bitbake -e core-image-minimal | grep "^DISTRO_FEATURES"
          echo '***************************************'
          bitbake -e > bb.environment

      - name: Build ca-certificates
        shell: bash
        working-directory: ../wrynose-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake ca-certificates

      - name: Build ca-certificates-native
        shell: bash
        working-directory: ../wrynose-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake ca-certificates-native

      - name: Build flutter-sdk-native
        shell: bash
        working-directory: ../wrynose-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake flutter-sdk-native

      - name: Build dart-sdk
        shell: bash
        working-directory: ../wrynose-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake dart-sdk

      - name: Build sentry
        shell: bash
        working-directory: ../wrynose-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake sentry

      - name: Build rive-text
        shell: bash
        working-directory: ../wrynose-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake rive-text

      - name: Build flutter-engine
        shell: bash
        working-directory: ../wrynose-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake flutter-engine

      - name: Build ivi-homescreen
        shell: bash
        working-directory: ../wrynose-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake ivi-homescreen

      - name: Build flutter-auto
        shell: bash
        working-directory: ../wrynose-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake flutter-auto

      - name: Build flutter-pi
        id: base
        shell: bash
        working-directory: ../wrynose-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake flutter-pi

      # The remote test-runner daemon. No Flutter involvement, so unlike the
      # app recipes below it builds on qemuarm too.
      - name: Build test-runner
        shell: bash
        working-directory: ../wrynose-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake test-runner

      # The ivi-homescreen v3 integration tests. All ten come from one upstream
      # tree at HOMESCREEN_COMMIT through ivi-homescreen-test.inc, so they share
      # a source revision and stand or fall together far more often than not.
      #
      # One workflow step, but bitbake is called once per recipe so they build
      # one at a time. A single 'bitbake app1 app2 ...' call lets bitbake run
      # all ten do_compile tasks at once, and they race: each drives the flutter
      # tool against its own recipe-sysroot-native, whose SDK files are
      # hardlinked from the shared native sysroot, so concurrent writes under
      # bin/cache are visible to the others. A recipe reading that directory
      # mid-write decides the tool snapshot is stale and re-resolves
      # packages/flutter_tools -- which does not inherit our --offline, so in a
      # network-isolated do_compile it can only fail.
      - name: Build ivi-homescreen integration tests
        # flutter build bundle has no linux-arm target platform,
        # so the app recipes do not parse for a 32-bit machine
        if: ${{ !cancelled() && steps.base.outcome == 'success' && matrix.machine != 'qemuarm' }}
        shell: bash
        working-directory: ../wrynose-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          apps="ivi-homescreen-gesture-playground \
            ivi-homescreen-hardware-keyboard-test \
            ivi-homescreen-keyboard-test \
            ivi-homescreen-mcp-drive-test \
            ivi-homescreen-multi-touch-test \
            ivi-homescreen-multi-view-test \
            ivi-homescreen-osgi-activator-test \
            ivi-homescreen-scroll-bench \
            ivi-homescreen-stopwatch-stress-test \
            ivi-homescreen-watchdog-test"
          # Report every failing test, not just the first. A round costs
          # over an hour, so learning about one broken recipe at a time
          # turns a single bad commit into a week of rebuilds.
          failed=""
          for a in $apps; do
            if bitbake $a; then
              continue
            fi
            failed="$failed $a"
          done
          if [ -n "$failed" ]; then
            echo "::error::integration tests failed:$failed"
            exit 1
          fi

      # The FFI applications. All three inherit flutter-app-native, so their
      # Dart packages carry hook/build.dart and compile native code during
      # `flutter build bundle` -- the path the integration tests above never
      # reach. They need the flutter_tools patch and the FLUTTER_HOOK_* wrappers
      # to build for the target rather than the build host; without those the
      # hook resolves a host compiler and emits a host-architecture library into
      # a target package (meta-flutter#801).
      #
      # flatpak_dart: talks to the flatpak system libraries.
      - name: Build flatpak-minimal-flatpak-dart-flutter-remote-manager
        # flutter build bundle has no linux-arm target platform,
        # so the app recipes do not parse for a 32-bit machine
        if: ${{ !cancelled() && steps.base.outcome == 'success' && matrix.machine != 'qemuarm' }}
        shell: bash
        working-directory: ../wrynose-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake flatpak-minimal-flatpak-dart-flutter-remote-manager

      #
      # appstream_dart: resolves a system sqlite3 through a hook user_define.
      - name: Build flatpak-minimal-appstream-dart-flathub-catalog
        # flutter build bundle has no linux-arm target platform,
        # so the app recipes do not parse for a 32-bit machine
        if: ${{ !cancelled() && steps.base.outcome == 'success' && matrix.machine != 'qemuarm' }}
        shell: bash
        working-directory: ../wrynose-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake flatpak-minimal-appstream-dart-flathub-catalog

      #
      # bluez_native: compiles a vendored sdbus-c++ from its own hook.
      - name: Build the Flutter SDK example apps
        # flutter build bundle has no linux-arm target platform,
        # so the app recipes do not parse for a 32-bit machine
        if: ${{ !cancelled() && steps.base.outcome == 'success' && matrix.machine != 'qemuarm' }}
        shell: bash
        working-directory: ../wrynose-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          # Two of the fourteen. hello_world proves the shape; flutter_gallery
          # proves it holds for an app with real dependencies.
          bitbake flutter-sdk-examples-hello-world \
                  flutter-sdk-dev-integration-tests-flutter-gallery

      - name: Build jwinarske-bluez-native-flutter-ble-scanner
        # flutter build bundle has no linux-arm target platform,
        # so the app recipes do not parse for a 32-bit machine
        if: ${{ !cancelled() && steps.base.outcome == 'success' && matrix.machine != 'qemuarm' }}
        shell: bash
        working-directory: ../wrynose-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake jwinarske-bluez-native-flutter-ble-scanner

      # Only reached when every step above succeeded; a failed or cancelled run
      # leaves the marker behind for the next one to act on.
      - name: Mark the build complete
        shell: bash
        working-directory: ../wrynose-linux-dummy
        run: rm -f .ci-build-incomplete
