name: master-build

on:
  pull_request:
    # No 'closed': nothing here is conditioned on the event, so closing or
    # merging a pull request started a second full build of a branch whose
    # work was already done. One sat queued for an hour holding the runners
    # while a release branch waited behind it.
    types: [ opened, synchronize, reopened ]
    # Each job is a 45-60 minute build and the runner is sequential, so one
    # pull request costs several hours of runner time. Skip that for changes
    # that cannot affect a build. Anything under conf/, classes/, lib/,
    # recipes-*/ or the build workflows themselves still triggers a full run.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'tools/**'
      - '.github/workflows/runner-maintenance.yml'
      # Release-branch builds are registered here so they can be
      # dispatched, but they never affect a master build.
      - '.github/workflows/scarthgap-build.yml'
      - '.github/workflows/kirkstone-build.yml'
      - '.github/workflows/dunfell-build.yml'
      - '.gitignore'
      - 'LICENSE'
  release:
    types: [ published, created, edited ]
  workflow_dispatch:

jobs:

  master-build:

    strategy:
      # One workflow per machine had drifted: riscv64 had lost sentry and
      # rive-text, arm had lost the app builds, and pdfium was building on two
      # of the four. A matrix keeps the shared steps in one place, so the next
      # step added to a build lands on every machine that should have it.
      # The runner is sequential, so these queue and run one at a time against
      # the same tree, exactly as the four separate workflows did.
      fail-fast: false
      matrix:
        machine: [qemux86-64, qemuarm64, qemuriscv64, qemuarm]

    name: master-${{ matrix.machine }}

    env:
      MACHINE: ${{ matrix.machine }}
      YOCTO_BRANCH: master

    runs-on: [self-hosted, linux]

    container:
      image: ghcr.io/meta-flutter/meta-flutter/ubuntu-24-dev:main
      options:
        --read-only
        --log-driver=none
        --user 1001:1001
        --userns keep-id:uid=1001,gid=1001
        --security-opt label=disable
        --pids-limit=-1
        --storage-opt overlay.mount_program=/usr/bin/fuse-overlayfs
        --storage-opt overlay.mountopt=nodev,metacopy=on,noxattrs=1
        -v /home/runner/.ssh:/home/dev/.ssh:ro
        -v /mnt/raid10/github-ci/download:/home/dev/dl:Z
        -v /mnt/raid10/github-ci/sstate/yocto/master-linux-dummy:/home/dev/sstate:Z


    steps:

      - uses: actions/checkout@v4
        with:
          path: ''

      - name: Fetch poky
        run: |
          [ -d ../master-linux-dummy ] || mkdir -p ../master-linux-dummy
          cd ../master-linux-dummy
          pwd
          ls -la
          # every layer cloned below must be listed here: this is a
          # persistent self-hosted runner, and 'git clone' into an
          # existing directory fails. Those failures are swallowed by
          # the backgrounded clones and bare 'wait', so an omitted
          # layer silently freezes at whatever revision it was first
          # cloned at. poky is kept to clear any legacy checkout.
          rm -rf poky bitbake openembedded-core meta-yocto \
                 meta-openembedded meta-drm meta-vulkan
          # 'wait' with no operands always returns 0, so a failed clone used to
          # leave the step green and the build ran against a missing or stale
          # layer. Collect the pids and wait on each one so the exit status is
          # actually observed.
          pids=""
          for repo in \
              https://git.openembedded.org/bitbake.git \
              https://git.openembedded.org/openembedded-core.git \
              https://git.yoctoproject.org/meta-yocto.git \
              https://github.com/openembedded/meta-openembedded.git \
              https://github.com/jwinarske/meta-drm.git \
              https://github.com/jwinarske/meta-vulkan.git ; do
              git clone -b ${{ env.YOCTO_BRANCH }} --single-branch "$repo" &
              pids="$pids $!:$repo"
          done

          rc=0
          for entry in $pids; do
              pid=${entry%%:*}
              repo=${entry#*:}
              if ! wait "$pid"; then
                  echo "::error::clone failed: $repo"
                  rc=1
              fi
          done
          exit $rc

      - name: Configure build
        shell: bash
        working-directory: ../master-linux-dummy
        run: |
          rm -rf build/conf
          . ./openembedded-core/oe-init-build-env
          echo '***************************************'
          sed -i '/MACHINE ??=/d' ./conf/local.conf
          echo "MACHINE ??= \"${{ env.MACHINE }}\"" >> ./conf/local.conf
          echo '***************************************'
          # Include CI build configuration to disable SPDX
          echo 'require ../../meta-flutter/conf/distro/include/ci-build.inc' >> ./conf/local.conf
          echo '********** ./conf/local.conf **********'
          cat ./conf/local.conf
          echo '***************************************'
          bitbake-layers show-layers
          bitbake-layers add-layer \
              ../openembedded-core/meta \
              ../meta-yocto/meta-yocto-bsp \
              ../meta-yocto/meta-poky \
              ../meta-openembedded/meta-oe \
              ../meta-openembedded/meta-filesystems \
              ../meta-openembedded/meta-gnome \
              ../meta-openembedded/meta-multimedia \
              ../meta-openembedded/meta-networking \
              ../meta-openembedded/meta-python \
              ../meta-drm \
              ../meta-vulkan \
              ../../meta-flutter \
              ../../meta-flutter/meta-flutter-apps
          # Only qemuriscv64 ever added this layer.
          if [ "${{ matrix.machine }}" = "qemuriscv64" ]; then
            bitbake-layers add-layer ../meta-riscv
          fi
          bitbake-layers show-layers
          echo '***************************************'
          bitbake -e virtual/kernel | grep "^PV"
          bitbake -e virtual/kernel | grep "^PN"
          echo '***************************************'
          bitbake -e core-image-minimal | grep "^DISTRO_FEATURES"
          echo '***************************************'
          bitbake -e > bb.environment
          # These four were only ever cleaned on arm64; keep that as it was
          # rather than widen or drop it as part of a file reshuffle.
          if [ "${{ matrix.machine }}" = "qemuarm64" ]; then
            bitbake openssl -c do_cleansstate
            bitbake util-linux-libuuid -c do_cleansstate
            bitbake libxcrypt -c do_cleansstate
            bitbake libffi -c do_cleansstate
          fi

      - name: Build ca-certificates
        shell: bash
        working-directory: ../master-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake ca-certificates -c do_cleansstate
          bitbake ca-certificates

      - name: Build ca-certificates-native
        shell: bash
        working-directory: ../master-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake ca-certificates-native -c do_cleansstate
          bitbake ca-certificates-native

      - name: Build flutter-sdk-native
        shell: bash
        working-directory: ../master-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake flutter-sdk-native -c do_cleansstate
          bitbake flutter-sdk-native

      - name: Build dart-sdk
        shell: bash
        working-directory: ../master-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake dart-sdk -c do_cleansstate
          bitbake dart-sdk

      - name: Build pdfium
        # pdfium was only ever built on arm64 and arm. Preserved as it was:
        # widening it is a build-coverage decision, not part of this reshuffle.
        if: matrix.machine == 'qemuarm64' || matrix.machine == 'qemuarm'
        shell: bash
        working-directory: ../master-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake pdfium -c do_cleansstate
          bitbake pdfium

      - name: Build sentry
        # sentry asserts a backend that needs a working unwinder, which this
        # release's GCC does not give riscv64, so riscv64 never built it.
        if: matrix.machine != 'qemuriscv64'
        shell: bash
        working-directory: ../master-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake sentry -c do_cleansstate
          bitbake sentry

      - name: Build rive-text
        # Not built on riscv64, as before.
        if: matrix.machine != 'qemuriscv64'
        shell: bash
        working-directory: ../master-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake rive-text -c do_cleansstate
          bitbake rive-text

      - name: Build flutter-engine
        shell: bash
        working-directory: ../master-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake flutter-engine -c do_cleansstate
          bitbake flutter-engine

      - name: Build ivi-homescreen
        shell: bash
        working-directory: ../master-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake ivi-homescreen -c do_cleansstate
          bitbake ivi-homescreen

      - name: Build flutter-auto
        shell: bash
        working-directory: ../master-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake flutter-auto -c do_cleansstate
          bitbake flutter-auto

      - name: Build flutter-pi
        id: base
        shell: bash
        working-directory: ../master-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake flutter-pi -c do_cleansstate
          bitbake flutter-pi

      # The ivi-homescreen v3 integration tests. All ten come from one upstream
      # tree at HOMESCREEN_COMMIT through ivi-homescreen-test.inc, so they share
      # a source revision and stand or fall together far more often than not.
      #
      # One workflow step, but bitbake is called once per recipe so they build
      # one at a time. A single 'bitbake app1 app2 ...' call lets bitbake run
      # all ten do_compile tasks at once, and they race: each drives the flutter
      # tool against its own recipe-sysroot-native, whose SDK files are
      # hardlinked from the shared native sysroot, so concurrent writes under
      # bin/cache are visible to the others. A recipe reading that directory
      # mid-write decides the tool snapshot is stale and re-resolves
      # packages/flutter_tools -- which does not inherit our --offline, so in a
      # network-isolated do_compile it can only fail.
      - name: Build ivi-homescreen integration tests
        # flutter build bundle has no linux-arm target platform,
        # so the app recipes do not parse for a 32-bit machine
        if: ${{ !cancelled() && steps.base.outcome == 'success' && matrix.machine != 'qemuarm' }}
        shell: bash
        working-directory: ../master-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          apps="ivi-homescreen-gesture-playground \
            ivi-homescreen-hardware-keyboard-test \
            ivi-homescreen-keyboard-test \
            ivi-homescreen-mcp-drive-test \
            ivi-homescreen-multi-touch-test \
            ivi-homescreen-multi-view-test \
            ivi-homescreen-osgi-activator-test \
            ivi-homescreen-scroll-bench \
            ivi-homescreen-stopwatch-stress-test \
            ivi-homescreen-watchdog-test"
          # Report every failing test, not just the first. A round costs
          # over an hour, so learning about one broken recipe at a time
          # turns a single bad commit into a week of rebuilds.
          failed=""
          for a in $apps; do
            if bitbake $a -c do_cleansstate && bitbake $a; then
              continue
            fi
            failed="$failed $a"
          done
          if [ -n "$failed" ]; then
            echo "::error::integration tests failed:$failed"
            exit 1
          fi

      # The FFI applications. All three inherit flutter-app-native, so their
      # Dart packages carry hook/build.dart and compile native code during
      # `flutter build bundle` -- the path the integration tests above never
      # reach. They need the flutter_tools patch and the FLUTTER_HOOK_* wrappers
      # to build for the target rather than the build host; without those the
      # hook resolves a host compiler and emits a host-architecture library into
      # a target package (meta-flutter#801).
      #
      # flatpak_dart: talks to the flatpak system libraries.
      - name: Build flatpak-minimal-flatpak-dart-flutter-remote-manager
        # flutter build bundle has no linux-arm target platform,
        # so the app recipes do not parse for a 32-bit machine
        if: ${{ !cancelled() && steps.base.outcome == 'success' && matrix.machine != 'qemuarm' }}
        shell: bash
        working-directory: ../master-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake flatpak-minimal-flatpak-dart-flutter-remote-manager -c do_cleansstate
          bitbake flatpak-minimal-flatpak-dart-flutter-remote-manager

      #
      # appstream_dart: resolves a system sqlite3 through a hook user_define.
      - name: Build flatpak-minimal-appstream-dart-flathub-catalog
        # flutter build bundle has no linux-arm target platform,
        # so the app recipes do not parse for a 32-bit machine
        if: ${{ !cancelled() && steps.base.outcome == 'success' && matrix.machine != 'qemuarm' }}
        shell: bash
        working-directory: ../master-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake flatpak-minimal-appstream-dart-flathub-catalog -c do_cleansstate
          bitbake flatpak-minimal-appstream-dart-flathub-catalog

      #
      # bluez_native: compiles a vendored sdbus-c++ from its own hook.
      - name: Build jwinarske-bluez-native-flutter-ble-scanner
        # flutter build bundle has no linux-arm target platform,
        # so the app recipes do not parse for a 32-bit machine
        if: ${{ !cancelled() && steps.base.outcome == 'success' && matrix.machine != 'qemuarm' }}
        shell: bash
        working-directory: ../master-linux-dummy
        run: |
          . ./openembedded-core/oe-init-build-env
          bitbake jwinarske-bluez-native-flutter-ble-scanner -c do_cleansstate
          bitbake jwinarske-bluez-native-flutter-ble-scanner
